<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Videos – Pure Vibes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .overlay {
            position: relative;
            z-index: 3;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            pointer-events: none; /* lets clicks go through to video controls if needed */
        }

        .title {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed, #ff00aa, #00ff9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientFlow 12s ease infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            opacity: 0.9;
            margin-bottom: 2rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .video-player {
            width: 92%;
            max-width: 1400px;
            aspect-ratio: 16 / 9;
            background: rgba(10, 10, 30, 0.6);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.18),
                        inset 0 0 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.15);
            z-index: 2;
            position: relative;
        }

        .video-player video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1.5rem;
            pointer-events: auto;
            z-index: 4;
        }

        .btn {
            padding: 1rem 2.2rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0095ff);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #7c3aed, #5e17eb);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.35);
        }

        .video-info {
            margin-top: 1.5rem;
            font-size: 1.3rem;
            opacity: 0.85;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                gap: 1rem;
            }
            .btn {
                width: 220px;
            }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>

    <div class="overlay">
        <div class="subtitle">Enjoy the entertainment while we find opportunities for you…</div>
    </div>

    <div class="video-player">
        <video id="mainVideo" autoplay loop muted playsinline>
            <!-- Default fallback space video -->
            <source src="https://cdn.pixabay.com/video/2021/05/19/77688-574983820_tiny.mp4" type="video/mp4">
            Your browser doesn't support HTML5 video.
        </video>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="playRandomVideo()">Next Vibe</button>
        <button class="btn btn-secondary" onclick="toggleMute()">Toggle Sound</button>
    </div>

    <div class="video-info" id="videoTitle">Cosmic Drift • Relaxing Nebula Loop</div>

    <script>
        // Starfield (same vibe as before)
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const stars = [];
        for (let i = 0; i < 350; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8 + 0.4,
                speed: Math.random() * 0.7 + 0.2
            });
        }

        function animateStars() {
            requestAnimationFrame(animateStars);
            ctx.fillStyle = 'rgba(0,0,0,0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.6 + 0.4})`;
                ctx.fill();

                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = -10;
                    star.x = Math.random() * canvas.width;
                }
            });
        }
        animateStars();

        // Simple video playlist (free stock videos from Pixabay/Pexels/etc.)
        const videos = [
            {
                url: "https://cdn.pixabay.com/video/2021/05/19/77688-574983820_tiny.mp4",
                title: "Cosmic Drift • Relaxing Nebula Loop"
            },
            {
                url: "https://cdn.pixabay.com/video/2023/01/10/140413-794909842_tiny.mp4",
                title: "Floating Through Galaxy • Space Aesthetic"
            },
            {
                url: "https://cdn.pixabay.com/video/2022/04/14/114242-708058248_tiny.mp4",
                title: "Aurora Dreams • Northern Lights Vibe"
            },
            {
                url: "https://cdn.pixabay.com/video/2021/08/03/8342-589514492_tiny.mp4",
                title: "Starry Night Ocean • Calm & Cosmic"
            },
            // Add more! Find free CC0 MP4s on pixabay.com/videos, pexels.com/videos, mixkit.co
            // Example search: "space loop", "nebula", "galaxy background", "aesthetic relaxing"
        ];

        const videoEl = document.getElementById('mainVideo');
        const titleEl = document.getElementById('videoTitle');

        function playRandomVideo() {
            const random = videos[Math.floor(Math.random() * videos.length)];
            videoEl.src = random.url;
            videoEl.load();
            videoEl.play().catch(() => {});
            titleEl.textContent = random.title;
        }

        function toggleMute() {
            videoEl.muted = !videoEl.muted;
        }

        // Start with random vibe
        playRandomVideo();
    </script>
</body>
</html>
