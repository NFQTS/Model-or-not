<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finding Opportunities – Vibes Only</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation; /* better mobile swipe */
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 2.5rem 1.5rem 1rem;
            text-align: center;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }

        .status-text {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: 500;
            opacity: 0.92;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #00d4ff, #ff00aa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .swipe-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: pan-y; /* allow vertical swipe */
        }

        .media-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .media-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        video.media-item {
            object-fit: cover;
        }

        audio, .text-overlay {
            display: none; /* placeholder for now */
        }

        .swipe-hint {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            opacity: 0.6;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .swipe-hint span {
            display: block;
            margin: 0.4rem 0;
        }

        @media (orientation: landscape) {
            .swipe-hint { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="status-text">Finding opportunities… please enjoy the vibes while you wait…</div>
    </div>

    <div class="swipe-container" id="swipeContainer">
        <!-- Media items appended here via JS -->
    </div>

    <div class="swipe-hint">
        <span>↑↓ for next vibe</span>
        <span>←→ to switch type (Video / Photo / Audio / Text)</span>
    </div>

    <script>
        // Simple starfield background (kept for space vibe underneath)
        const canvas = document.createElement('canvas');
        canvas.style.position = 'absolute';
        canvas.style.inset = '0';
        canvas.style.zIndex = '1';
        document.body.prepend(canvas);

        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const stars = [];
        for (let i = 0; i < 250; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.5 + 0.3,
                speed: Math.random() * 0.4 + 0.1
            });
        }

        function animateStars() {
            requestAnimationFrame(animateStars);
            ctx.fillStyle = 'rgba(0,0,0,0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.fill();
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
            });
        }
        animateStars();

        // Content categories (vertical-friendly free media)
        const categories = {
            video: [
                {
                    type: 'video',
                    url: 'https://cdn.pixabay.com/video/2022/11/27/140671-775595973_large.mp4', // vertical galaxy example (check if vertical; many are)
                    title: 'Cosmic Nebula Drift'
                },
                {
                    type: 'video',
                    url: 'https://cdn.pixabay.com/video/2021/05/19/77688-574983820_tiny.mp4',
                    title: 'Floating Through Space'
                },
                {
                    type: 'video',
                    url: 'https://cdn.pixabay.com/video/2023/01/10/140413-794909842_tiny.mp4',
                    title: 'Galaxy Pulse'
                },
                // Add more vertical space/relaxing videos from Pixabay, Pexels, Mixkit (search "vertical nebula", "aesthetic loop vertical")
            ],
            photo: [
                {
                    type: 'photo',
                    url: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80',
                    title: 'Vibrant Nebula'
                },
                {
                    type: 'photo',
                    url: 'https://images.unsplash.com/photo-1447433589675-4aaa569f3e05?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80',
                    title: 'Deep Space Glow'
                },
                // More from Unsplash nebula search, vertical crops
            ],
            audio: [
                // For audio we'd need a visualizer or static bg + audio player
                // Placeholder: use a video with sound or add canvas visualizer later
                { type: 'audio', title: 'Ambient Space Drone (coming soon)' },
            ],
            text: [
                { type: 'text', content: 'Just floating through the cosmos... ✨', title: 'Zen Quote' },
                { type: 'text', content: 'Opportunities are like stars – you can’t see them all at once.', title: 'Reflection' },
            ]
        };

        const container = document.getElementById('swipeContainer');
        let currentCategory = 'video';
        let currentIndex = 0;
        let startY = 0, startX = 0;
        let isDragging = false;

        function loadMedia(category, index) {
            container.innerHTML = '';

            const item = categories[category][index % categories[category].length];
            const wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';

            let el;
            if (item.type === 'video') {
                el = document.createElement('video');
                el.className = 'media-item';
                el.src = item.url;
                el.autoplay = true;
                el.loop = true;
                el.muted = true; // start muted, user can unmute if wanted
                el.playsInline = true;
            } else if (item.type === 'photo') {
                el = document.createElement('img');
                el.className = 'media-item';
                el.src = item.url;
                el.alt = item.title || '';
            } else if (item.type === 'text') {
                el = document.createElement('div');
                el.className = 'media-item';
                el.style.background = 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                el.style.fontSize = 'clamp(1.8rem, 6vw, 4rem)';
                el.style.padding = '2rem';
                el.style.textAlign = 'center';
                el.innerHTML = `<p>${item.content}</p>`;
            } else {
                // audio placeholder
                el = document.createElement('div');
                el.textContent = item.title;
            }

            wrapper.appendChild(el);
            container.appendChild(wrapper);

            // Title overlay at bottom if wanted
            if (item.title) {
                const title = document.createElement('div');
                title.style.position = 'absolute';
                title.style.bottom = '5%';
                title.style.left = '50%';
                title.style.transform = 'translateX(-50%)';
                title.style.fontSize = '1.2rem';
                title.style.opacity = '0.8';
                title.style.pointerEvents = 'none';
                title.textContent = item.title;
                container.appendChild(title);
            }
        }

        // Swipe detection
        container.addEventListener('touchstart', e => {
            startY = e.touches[0].clientY;
            startX = e.touches[0].clientX;
            isDragging = true;
        }, { passive: true });

        container.addEventListener('touchmove', e => {
            if (!isDragging) return;
            e.preventDefault(); // prevent page scroll
        }, { passive: false });

        container.addEventListener('touchend', e => {
            if (!isDragging) return;
            isDragging = false;

            const endY = e.changedTouches[0].clientY;
            const endX = e.changedTouches[0].clientX;

            const deltaY = endY - startY;
            const deltaX = endX - startX;

            // Vertical swipe → next in same category
            if (Math.abs(deltaY) > 60 && Math.abs(deltaY) > Math.abs(deltaX)) {
                if (deltaY < 0) { // swipe up → next
                    currentIndex++;
                } else { // swipe down → prev
                    currentIndex = Math.max(0, currentIndex - 1);
                }
                loadMedia(currentCategory, currentIndex);
            }
            // Horizontal swipe → change category
            else if (Math.abs(deltaX) > 60 && Math.abs(deltaX) > Math.abs(deltaY)) {
                const catKeys = Object.keys(categories);
                let catIndex = catKeys.indexOf(currentCategory);

                if (deltaX < 0) { // swipe left → next category
                    catIndex = (catIndex + 1) % catKeys.length;
                } else { // swipe right → prev category
                    catIndex = (catIndex - 1 + catKeys.length) % catKeys.length;
                }

                currentCategory = catKeys[catIndex];
                currentIndex = 0;
                loadMedia(currentCategory, currentIndex);
            }
        }, { passive: false });

        // Mouse drag support (for desktop testing)
        let mouseDown = false;
        container.addEventListener('mousedown', e => {
            startX = e.clientX;
            startY = e.clientY;
            mouseDown = true;
        });
        container.addEventListener('mousemove', e => {
            if (!mouseDown) return;
        });
        container.addEventListener('mouseup', e => {
            if (!mouseDown) return;
            mouseDown = false;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            // same logic as touch
            if (Math.abs(deltaY) > 60 && Math.abs(deltaY) > Math.abs(deltaX)) {
                if (deltaY < 0) currentIndex++;
                else currentIndex = Math.max(0, currentIndex - 1);
                loadMedia(currentCategory, currentIndex);
            } else if (Math.abs(deltaX) > 60 && Math.abs(deltaX) > Math.abs(deltaY)) {
                const catKeys = Object.keys(categories);
                let catIndex = catKeys.indexOf(currentCategory);
                catIndex = deltaX < 0 ? (catIndex + 1) % catKeys.length : (catIndex - 1 + catKeys.length) % catKeys.length;
                currentCategory = catKeys[catIndex];
                currentIndex = 0;
                loadMedia(currentCategory, currentIndex);
            }
        });

        // Start with videos
        loadMedia('video', 0);
    </script>
</body>
</html>
